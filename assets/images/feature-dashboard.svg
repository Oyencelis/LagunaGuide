<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#fcf9f6; font-family:'Poppins', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="10" fill="#ffffff" stroke="#e0d7cf" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="42" rx="10" fill="#f2ece6"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <text x="100" y="25" font-size="12" fill="#66534e">LTCATO Provincial Executive Management Portal — Admin Dashboard</text>

  <!-- Left Sidebar Nav -->
  <rect x="0" y="42" width="180" height="458" fill="#4a0404"/>
  <text x="20" y="75" font-size="13" font-weight="700" fill="#ffffff">LTCATO ADMIN</text>
  <line x1="20" y1="88" x2="160" y2="88" stroke="#771b1b"/>

  <rect x="15" y="100" width="150" height="32" rx="6" fill="#9b2c2c"/>
  <text x="30" y="121" font-size="11" font-weight="600" fill="#ffffff">📊 Overview KPI</text>

  <rect x="15" y="140" width="150" height="32" rx="6" fill="transparent"/>
  <text x="30" y="161" font-size="11" font-weight="500" fill="#fdf2d6">🏛️ 30 LGUs Registry</text>

  <rect x="15" y="180" width="150" height="32" rx="6" fill="transparent"/>
  <text x="30" y="201" font-size="11" font-weight="500" fill="#fdf2d6">📍 Spots Verification</text>

  <rect x="15" y="220" width="150" height="32" rx="6" fill="transparent"/>
  <text x="30" y="241" font-size="11" font-weight="500" fill="#fdf2d6">📈 Arrival Ingestion</text>

  <rect x="15" y="260" width="150" height="32" rx="6" fill="transparent"/>
  <text x="30" y="281" font-size="11" font-weight="500" fill="#fdf2d6">🤖 LARA Bot Logs</text>

  <rect x="15" y="300" width="150" height="32" rx="6" fill="transparent"/>
  <text x="30" y="321" font-size="11" font-weight="500" fill="#fdf2d6">📑 DOT Compliance</text>

  <!-- Main Content Area -->
  <g transform="translate(195, 55)">
    <!-- KPI Row -->
    <rect x="0" y="0" width="185" height="75" rx="8" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="14" y="24" font-size="10" fill="#776863">Total Verified Spots</text>
    <text x="14" y="52" font-size="22" font-weight="700" fill="#9b2c2c">156 Spots</text>
    <text x="14" y="68" font-size="9" fill="#166534">Across 30 Laguna LGUs</text>

    <rect x="200" y="0" width="185" height="75" rx="8" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="214" y="24" font-size="10" fill="#776863">Annual Tourist Traffic</text>
    <text x="214" y="52" font-size="22" font-weight="700" fill="#2a0202">1,482,930</text>
    <text x="214" y="68" font-size="9" fill="#166534">▲ 14.2% vs previous cycle</text>

    <rect x="400" y="0" width="185" height="75" rx="8" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="414" y="24" font-size="10" fill="#776863">LARA Inquiries Handled</text>
    <text x="414" y="52" font-size="22" font-weight="700" fill="#166534">24,812</text>
    <text x="414" y="68" font-size="9" fill="#9b2c2c">Multi-stakeholder NLP</text>

    <!-- Map & LGU Distribution Area -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="375" height="335" rx="8" fill="#ffffff" stroke="#e6ded6" filter="url(#shadow)"/>
      <rect x="0" y="0" width="375" height="36" rx="8" fill="#faf7f5"/>
      <text x="16" y="23" font-size="12" font-weight="700" fill="#4a0404">Provincial Geographic Map &amp; Cluster Hotspots</text>

      <!-- Decorative Stylized Laguna Lake & LGUs -->
      <path d="M 50 80 Q 150 50 250 90 T 320 200 Q 250 280 180 250 T 80 220 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
      <text x="180" y="160" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Laguna de Bay</text>

      <!-- Pin Santa Cruz (Capital) -->
      <circle cx="240" cy="190" r="7" fill="#dc2626"/>
      <circle cx="240" cy="190" r="14" fill="#dc2626" opacity="0.2"/>
      <text x="252" y="194" font-size="10" font-weight="700" fill="#991b1b">Santa Cruz (Capital)</text>

      <!-- Pin Calamba -->
      <circle cx="90" cy="170" r="5" fill="#f59e0b"/>
      <text x="98" y="174" font-size="9" font-weight="600" fill="#78350f">Calamba City</text>

      <!-- Pin San Pablo -->
      <circle cx="150" cy="250" r="5" fill="#166534"/>
      <text x="158" y="254" font-size="9" font-weight="600" fill="#14532d">San Pablo City</text>

      <!-- Pin Cavinti -->
      <circle cx="300" cy="170" r="5" fill="#9333ea"/>
      <text x="308" y="174" font-size="9" font-weight="600" fill="#581c87">Cavinti Eco</text>

      <rect x="15" y="295" width="345" height="26" rx="4" fill="#faf7f5"/>
      <text x="187" y="312" font-size="10" fill="#66534e" text-anchor="middle">All 30 LGUs mapped with geofences &amp; tourist attraction clusters</text>
    </g>

    <!-- Recent System Activity -->
    <g transform="translate(390, 90)">
      <rect x="0" y="0" width="195" height="335" rx="8" fill="#ffffff" stroke="#e6ded6" filter="url(#shadow)"/>
      <rect x="0" y="0" width="195" height="36" rx="8" fill="#faf7f5"/>
      <text x="12" y="23" font-size="11" font-weight="700" fill="#4a0404">Real-time Activity</text>

      <!-- Item 1 -->
      <circle cx="20" cy="60" r="4" fill="#166534"/>
      <text x="32" y="58" font-size="10" font-weight="600" fill="#2a0202">Cavinti MTO</text>
      <text x="32" y="70" font-size="9" fill="#776863">Submitted Oct arrivals</text>

      <!-- Item 2 -->
      <circle cx="20" cy="95" r="4" fill="#f59e0b"/>
      <text x="32" y="93" font-size="10" font-weight="600" fill="#2a0202">Majayjay Resort</text>
      <text x="32" y="105" font-size="9" fill="#776863">Updated room inventory</text>

      <!-- Item 3 -->
      <circle cx="20" cy="130" r="4" fill="#9b2c2c"/>
      <text x="32" y="128" font-size="10" font-weight="600" fill="#2a0202">LARA Chatbot</text>
      <text x="32" y="140" font-size="9" fill="#776863">Generated 3-day itinerary</text>

      <!-- Item 4 -->
      <circle cx="20" cy="165" r="4" fill="#166534"/>
      <text x="32" y="163" font-size="10" font-weight="600" fill="#2a0202">LTCATO SuperAdmin</text>
      <text x="32" y="175" font-size="9" fill="#776863">Approved Nagcarlan spot</text>

      <!-- Item 5 -->
      <circle cx="20" cy="200" r="4" fill="#3b82f6"/>
      <text x="32" y="198" font-size="10" font-weight="600" fill="#2a0202">DOT Regional Office</text>
      <text x="32" y="210" font-size="9" fill="#776863">Consolidated report exported</text>

      <rect x="12" y="285" width="170" height="35" rx="6" fill="#4a0404"/>
      <text x="97" y="307" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Generate DOT Export</text>
    </g>
  </g>
</svg>
