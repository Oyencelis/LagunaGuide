<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#fcf9f6; font-family:'Poppins', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="10" fill="#ffffff" stroke="#e0d7cf" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="42" rx="10" fill="#f2ece6"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <text x="100" y="25" font-size="12" fill="#66534e">Tourist Arrival Ingestion &amp; 30 LGUs Compliance Tracker</text>

  <!-- Metric Badges Row -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="175" height="60" rx="8" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="14" y="24" font-size="11" fill="#776863">Total Provincial Arrivals</text>
    <text x="14" y="48" font-size="20" font-weight="700" fill="#9b2c2c">1,482,930</text>

    <rect x="190" y="0" width="175" height="60" rx="8" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="204" y="24" font-size="11" fill="#776863">LGU Submissions (Oct 2026)</text>
    <text x="204" y="48" font-size="20" font-weight="700" fill="#166534">28 / 30 LGUs (93%)</text>

    <rect x="380" y="0" width="175" height="60" rx="8" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="394" y="24" font-size="11" fill="#776863">Domestic vs Foreign</text>
    <text x="394" y="48" font-size="20" font-weight="700" fill="#2a0202">88.4% / 11.6%</text>

    <rect x="570" y="0" width="180" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="584" y="24" font-size="11" fill="#991b1b">Pending Submissions</text>
    <text x="584" y="48" font-size="20" font-weight="700" fill="#dc2626">2 Municipalities</text>
  </g>

  <!-- Main Table View -->
  <g transform="translate(25, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="750" height="340" rx="10" fill="#ffffff" stroke="#e6ded6"/>
    <rect x="0" y="0" width="750" height="40" rx="10" fill="#4a0404"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#ffffff">Municipal Tourism Officer (MTO) Monthly Report Status</text>
    <rect x="625" y="8" width="110" height="24" rx="4" fill="#f5c842"/>
    <text x="680" y="24" font-size="10" font-weight="700" fill="#2a0202" text-anchor="middle">+ New Batch Entry</text>

    <!-- Table Header -->
    <rect x="0" y="40" width="750" height="30" fill="#faf7f5"/>
    <text x="20" y="60" font-size="11" font-weight="700" fill="#66534e">LGU MUNICIPALITY</text>
    <text x="200" y="60" font-size="11" font-weight="700" fill="#66534e">OVERNIGHT</text>
    <text x="310" y="60" font-size="11" font-weight="700" fill="#66534e">SAME DAY</text>
    <text x="420" y="60" font-size="11" font-weight="700" fill="#66534e">TOTAL ARRIVALS</text>
    <text x="550" y="60" font-size="11" font-weight="700" fill="#66534e">VERIFICATION</text>
    <text x="680" y="60" font-size="11" font-weight="700" fill="#66534e">ACTION</text>

    <!-- Row 1 -->
    <line x1="0" y1="105" x2="750" y2="105" stroke="#eee3db"/>
    <text x="20" y="93" font-size="12" font-weight="600" fill="#2a0202">Santa Cruz (Capital)</text>
    <text x="200" y="93" font-size="12" fill="#333333">14,280</text>
    <text x="310" y="93" font-size="12" fill="#333333">48,910</text>
    <text x="420" y="93" font-size="12" font-weight="700" fill="#9b2c2c">63,190</text>
    <rect x="545" y="78" width="85" height="20" rx="10" fill="#dcfce7"/>
    <text x="587" y="92" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">APPROVED</text>
    <text x="680" y="93" font-size="11" font-weight="600" fill="#9b2c2c">View CSV</text>

    <!-- Row 2 -->
    <line x1="0" y1="145" x2="750" y2="145" stroke="#eee3db"/>
    <text x="20" y="133" font-size="12" font-weight="600" fill="#2a0202">Cavinti (Eco-Zone)</text>
    <text x="200" y="133" font-size="12" fill="#333333">32,150</text>
    <text x="310" y="133" font-size="12" fill="#333333">84,600</text>
    <text x="420" y="133" font-size="12" font-weight="700" fill="#9b2c2c">116,750</text>
    <rect x="545" y="118" width="85" height="20" rx="10" fill="#dcfce7"/>
    <text x="587" y="132" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">APPROVED</text>
    <text x="680" y="133" font-size="11" font-weight="600" fill="#9b2c2c">View CSV</text>

    <!-- Row 3 -->
    <line x1="0" y1="185" x2="750" y2="185" stroke="#eee3db"/>
    <text x="20" y="173" font-size="12" font-weight="600" fill="#2a0202">San Pablo City</text>
    <text x="200" y="173" font-size="12" fill="#333333">28,940</text>
    <text x="310" y="173" font-size="12" fill="#333333">102,400</text>
    <text x="420" y="173" font-size="12" font-weight="700" fill="#9b2c2c">131,340</text>
    <rect x="545" y="158" width="85" height="20" rx="10" fill="#dcfce7"/>
    <text x="587" y="172" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">APPROVED</text>
    <text x="680" y="173" font-size="11" font-weight="600" fill="#9b2c2c">View CSV</text>

    <!-- Row 4 -->
    <line x1="0" y1="225" x2="750" y2="225" stroke="#eee3db"/>
    <text x="20" y="213" font-size="12" font-weight="600" fill="#2a0202">Majayjay</text>
    <text x="200" y="213" font-size="12" fill="#333333">18,400</text>
    <text x="310" y="213" font-size="12" fill="#333333">54,120</text>
    <text x="420" y="213" font-size="12" font-weight="700" fill="#9b2c2c">72,520</text>
    <rect x="545" y="198" width="85" height="20" rx="10" fill="#fef3c7"/>
    <text x="587" y="212" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">UNDER REVIEW</text>
    <text x="680" y="213" font-size="11" font-weight="600" fill="#166534">Verify</text>

    <!-- Row 5 -->
    <line x1="0" y1="265" x2="750" y2="265" stroke="#eee3db"/>
    <text x="20" y="253" font-size="12" font-weight="600" fill="#2a0202">Paete (Woodcarving Capital)</text>
    <text x="200" y="253" font-size="12" fill="#333333">9,310</text>
    <text x="310" y="253" font-size="12" fill="#333333">31,040</text>
    <text x="420" y="253" font-size="12" font-weight="700" fill="#9b2c2c">40,350</text>
    <rect x="545" y="238" width="85" height="20" rx="10" fill="#dcfce7"/>
    <text x="587" y="252" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">APPROVED</text>
    <text x="680" y="253" font-size="11" font-weight="600" fill="#9b2c2c">View CSV</text>
  </g>
</svg>
