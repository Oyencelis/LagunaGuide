<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#fcf9f6; font-family:'Poppins', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="10" fill="#ffffff" stroke="#e0d7cf" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="42" rx="10" fill="#f2ece6"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <text x="100" y="25" font-size="12" fill="#66534e">LARA AI Multi-Stakeholder Intelligence System</text>

  <!-- LARA Modal UI Mockup -->
  <g transform="translate(160, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="415" rx="12" fill="#ffffff" stroke="#9b2c2c" stroke-width="2"/>
    <rect x="0" y="0" width="480" height="55" rx="12" fill="#4a0404"/>
    <circle cx="32" cy="27" r="16" fill="#f5c842"/>
    <text x="32" y="32" font-size="14" text-anchor="middle" font-weight="900" fill="#2a0202">🤖</text>
    <text x="58" y="27" font-size="15" font-weight="700" fill="#ffffff">LARA AI Assistant</text>
    <text x="58" y="42" font-size="11" fill="#fdf2d6">Laguna Automated Recommendation Assistant</text>
    <rect x="360" y="16" width="100" height="22" rx="11" fill="#166534"/>
    <text x="410" y="31" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ONLINE • NLP</text>

    <!-- Chat Messages -->
    <!-- Bot Message 1 -->
    <rect x="20" y="70" width="370" height="60" rx="10" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="32" y="90" font-size="11" font-weight="700" fill="#9b2c2c">LARA • AI Guide</text>
    <text x="32" y="108" font-size="11" fill="#333333">Mabuhay! I am LARA. How may I assist your Laguna journey today?</text>
    <text x="32" y="122" font-size="10" fill="#776863">Try: "Best heritage spots in Laguna" or "Submit arrival report"</text>

    <!-- User Message 1 -->
    <rect x="130" y="145" width="330" height="42" rx="10" fill="#9b2c2c"/>
    <text x="142" y="165" font-size="11" font-weight="600" fill="#ffffff">What are the top waterfalls to visit near Majayjay and Cavinti?</text>
    <text x="142" y="180" font-size="9" fill="#fdf2d6">Tourist Inquiry • 10:42 AM</text>

    <!-- Bot Message 2 -->
    <rect x="20" y="200" width="410" height="110" rx="10" fill="#faf7f5" stroke="#e6ded6"/>
    <text x="32" y="220" font-size="11" font-weight="700" fill="#9b2c2c">LARA • AI Guide</text>
    <text x="32" y="238" font-size="11" fill="#333333">Here are the top waterfall destinations in that cluster:</text>
    <text x="32" y="256" font-size="11" fill="#166534" font-weight="600">1. Taytay Falls (Majayjay) - Ice-cold spring waters, camping.</text>
    <text x="32" y="274" font-size="11" fill="#166534" font-weight="600">2. Pagsanjan / Cavinti Falls - World-famous rapids boat ride.</text>
    <text x="32" y="294" font-size="10" fill="#776863">Would you like me to generate a 1-day itinerary with budget estimates?</text>

    <!-- Quick Prompts -->
    <rect x="20" y="325" width="130" height="26" rx="13" fill="#fdf2d6" stroke="#f5c842"/>
    <text x="85" y="342" font-size="10" font-weight="600" fill="#4a0404" text-anchor="middle">Generate 1-Day Itinerary</text>

    <rect x="160" y="325" width="125" height="26" rx="13" fill="#fdf2d6" stroke="#f5c842"/>
    <text x="222" y="342" font-size="10" font-weight="600" fill="#4a0404" text-anchor="middle">Local Delicacies</text>

    <rect x="295" y="325" width="145" height="26" rx="13" fill="#fdf2d6" stroke="#f5c842"/>
    <text x="367" y="342" font-size="10" font-weight="600" fill="#4a0404" text-anchor="middle">MTO Arrival Reporting FAQ</text>

    <!-- Input Bar -->
    <rect x="15" y="365" width="375" height="38" rx="8" fill="#f5f0ec" stroke="#d5ccc4"/>
    <text x="30" y="388" font-size="11" fill="#888888">Ask LARA anything about Laguna tourism or MTO guidelines...</text>
    <rect x="400" y="365" width="65" height="38" rx="8" fill="#9b2c2c"/>
    <text x="432" y="389" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Send</text>
  </g>
</svg>
