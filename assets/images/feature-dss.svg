<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#fcf9f6; font-family:'Poppins', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="10" fill="#ffffff" stroke="#e0d7cf" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="42" rx="10" fill="#f2ece6"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <text x="100" y="25" font-size="12" fill="#66534e">Decision Support System (DSS) — VADER Sentiment &amp; Capacity Analytics</text>

  <!-- Left: Sentiment Analysis Breakdown -->
  <g transform="translate(25, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="415" rx="10" fill="#ffffff" stroke="#e6ded6"/>
    <rect x="0" y="0" width="360" height="40" rx="10" fill="#4a0404"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#ffffff">VADER NLP Sentiment Analysis</text>

    <!-- Sentiment Donut / Bar -->
    <text x="20" y="70" font-size="12" font-weight="700" fill="#2a0202">Tourist Feedback Sentiment (N = 3,420 Reviews)</text>
    
    <!-- Positive -->
    <text x="20" y="105" font-size="11" font-weight="600" fill="#166534">Positive Sentiment (84.6%)</text>
    <rect x="20" y="115" width="320" height="18" rx="4" fill="#eee3db"/>
    <rect x="20" y="115" width="270" height="18" rx="4" fill="#166534"/>
    <text x="295" y="129" font-size="10" font-weight="700" fill="#ffffff">84.6%</text>

    <!-- Neutral -->
    <text x="20" y="155" font-size="11" font-weight="600" fill="#b45309">Neutral Sentiment (11.2%)</text>
    <rect x="20" y="165" width="320" height="18" rx="4" fill="#eee3db"/>
    <rect x="20" y="165" width="36" height="18" rx="4" fill="#f59e0b"/>
    <text x="65" y="179" font-size="10" font-weight="700" fill="#b45309">11.2%</text>

    <!-- Negative -->
    <text x="20" y="205" font-size="11" font-weight="600" fill="#991b1b">Negative / Concerns (4.2%)</text>
    <rect x="20" y="215" width="320" height="18" rx="4" fill="#eee3db"/>
    <rect x="20" y="215" width="14" height="18" rx="4" fill="#ef4444"/>
    <text x="42" y="229" font-size="10" font-weight="700" fill="#991b1b">4.2%</text>

    <!-- Keyword Cloud / Themes -->
    <text x="20" y="265" font-size="12" font-weight="700" fill="#2a0202">Top Extracted Sentiment Themes:</text>
    <rect x="20" y="280" width="150" height="26" rx="13" fill="#f0fdf4" stroke="#86efac"/>
    <text x="95" y="297" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">✓ "Breathtaking scenery"</text>

    <rect x="180" y="280" width="160" height="26" rx="13" fill="#f0fdf4" stroke="#86efac"/>
    <text x="260" y="297" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">✓ "Warm local hospitality"</text>

    <rect x="20" y="315" width="155" height="26" rx="13" fill="#f0fdf4" stroke="#86efac"/>
    <text x="97" y="332" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">✓ "Delicious Kesong Puti"</text>

    <rect x="185" y="315" width="155" height="26" rx="13" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="262" y="332" font-size="10" font-weight="600" fill="#991b1b" text-anchor="middle">⚠ "Weekend parking delay"</text>

    <rect x="20" y="360" width="320" height="38" rx="6" fill="#fdf2d6" stroke="#f5c842"/>
    <text x="32" y="382" font-size="11" font-weight="700" fill="#4a0404">AI Action Insight for LTCATO Staff:</text>
    <text x="32" y="394" font-size="10" fill="#66534e">Deploy traffic marshals to Cavinti / Pagsanjan on Saturday peaks.</text>
  </g>

  <!-- Right: Trend Forecasting Graph -->
  <g transform="translate(405, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="370" height="415" rx="10" fill="#ffffff" stroke="#e6ded6"/>
    <rect x="0" y="0" width="370" height="40" rx="10" fill="#faf7f5"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#9b2c2c">Peak Seasonal Arrival Forecasting</text>

    <!-- Simulated Chart Axes -->
    <line x1="50" y1="330" x2="340" y2="330" stroke="#d5ccc4" stroke-width="1.5"/>
    <line x1="50" y1="90" x2="50" y2="330" stroke="#d5ccc4" stroke-width="1.5"/>

    <!-- Y Labels -->
    <text x="40" y="100" font-size="9" fill="#888888" text-anchor="end">200k</text>
    <text x="40" y="170" font-size="9" fill="#888888" text-anchor="end">150k</text>
    <text x="40" y="240" font-size="9" fill="#888888" text-anchor="end">100k</text>
    <text x="40" y="310" font-size="9" fill="#888888" text-anchor="end">50k</text>

    <!-- Grid lines -->
    <line x1="50" y1="95" x2="340" y2="95" stroke="#f2ece6" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="50" y1="165" x2="340" y2="165" stroke="#f2ece6" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="50" y1="235" x2="340" y2="235" stroke="#f2ece6" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="50" y1="305" x2="340" y2="305" stroke="#f2ece6" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Bar Elements (Jan, Mar, May, Jul, Sep, Nov) -->
    <!-- Jan -->
    <rect x="65" y="250" width="28" height="80" rx="3" fill="#9b2c2c" opacity="0.8"/>
    <text x="79" y="348" font-size="9" fill="#66534e" text-anchor="middle">Jan</text>

    <!-- Mar (Anilag peak) -->
    <rect x="110" y="110" width="28" height="220" rx="3" fill="#f5c842"/>
    <text x="124" y="348" font-size="9" fill="#66534e" text-anchor="middle">Mar ★</text>
    <text x="124" y="102" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">Anilag</text>

    <!-- May (Summer peak) -->
    <rect x="155" y="130" width="28" height="200" rx="3" fill="#9b2c2c"/>
    <text x="169" y="348" font-size="9" fill="#66534e" text-anchor="middle">May</text>

    <!-- Jul (Rainy lull) -->
    <rect x="200" y="270" width="28" height="60" rx="3" fill="#9b2c2c" opacity="0.6"/>
    <text x="214" y="348" font-size="9" fill="#66534e" text-anchor="middle">Jul</text>

    <!-- Sep -->
    <rect x="245" y="230" width="28" height="100" rx="3" fill="#9b2c2c" opacity="0.7"/>
    <text x="259" y="348" font-size="9" fill="#66534e" text-anchor="middle">Sep</text>

    <!-- Nov (Holiday) -->
    <rect x="290" y="150" width="28" height="180" rx="3" fill="#166534"/>
    <text x="304" y="348" font-size="9" fill="#66534e" text-anchor="middle">Nov</text>

    <rect x="50" y="375" width="290" height="24" rx="4" fill="#faf7f5"/>
    <text x="195" y="391" font-size="10" font-weight="600" fill="#4a0404" text-anchor="middle">Predicted Peak: March Anilag Festival +18.4% YoY</text>
  </g>
</svg>
